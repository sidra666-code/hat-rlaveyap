<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<meta name="theme-color" content="#ff5c9a">

<title>Son Ne Zaman?</title>

<style>

/* =====================================================
   TEMEL
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: #100b10;
    color: #fff;

    overflow-x: hidden;

    transition:
        background .45s ease,
        color .45s ease;
}

button,
input {
    font-family: inherit;
}


/* =====================================================
   KIZ TEMASI
===================================================== */

body.girl {

    --accent: #ff5c9a;
    --accent2: #ff8fbb;
    --accentRGB: 255,92,154;

    --bg: #100b10;
    --bg2: #171018;

    --card: rgba(31,19,29,.86);
    --card2: rgba(39,23,35,.92);

    --text: #fff7fb;
    --muted: #bcaab5;

    --border: rgba(255,150,195,.12);

    --green: #45d99b;
    --yellow: #ffc45b;
    --red: #ff6175;

    --soft:
        rgba(255,92,154,.10);

    --glow:
        rgba(255,92,154,.24);
}


/* =====================================================
   ERKEK TEMASI
===================================================== */

body.boy {

    --accent: #00aaff;
    --accent2: #00d5ff;
    --accentRGB: 0,170,255;

    --bg: #060b11;
    --bg2: #09131d;

    --card: rgba(10,21,31,.88);
    --card2: rgba(12,28,42,.94);

    --text: #f2fbff;
    --muted: #91a8b7;

    --border: rgba(0,190,255,.13);

    --green: #35e69a;
    --yellow: #ffd05c;
    --red: #ff5d72;

    --soft:
        rgba(0,170,255,.10);

    --glow:
        rgba(0,190,255,.28);
}


/* =====================================================
   ARKA PLAN IŞIKLARI
===================================================== */

body::before {

    content: "";

    position: fixed;

    width: 280px;
    height: 280px;

    border-radius: 50%;

    top: -150px;
    right: -120px;

    background:
        rgba(
            var(--accentRGB),
            .13
        );

    filter: blur(75px);

    pointer-events: none;

    z-index: -2;

    transition:
        background .5s ease;
}


body::after {

    content: "";

    position: fixed;

    width: 250px;
    height: 250px;

    border-radius: 50%;

    bottom: -150px;
    left: -120px;

    background:
        rgba(
            var(--accentRGB),
            .07
        );

    filter: blur(75px);

    pointer-events: none;

    z-index: -2;

    transition:
        background .5s ease;
}


/* =====================================================
   TELEFON UYGULAMASI
===================================================== */

.app {

    width: 100%;
    max-width: 520px;

    min-height: 100vh;

    margin: auto;

    position: relative;

    padding-bottom:
        calc(
            95px +
            env(safe-area-inset-bottom)
        );
}


/* =====================================================
   HEADER
===================================================== */

.header {

    padding:
        calc(
            18px +
            env(safe-area-inset-top)
        )
        18px
        10px;

    animation:
        headerIn .5s ease both;
}


.header-row {

    display: flex;

    align-items: center;

    justify-content: space-between;
}


.logo-area {

    display: flex;

    align-items: center;

    gap: 12px;
}


.logo {

    width: 49px;
    height: 49px;

    border-radius: 17px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 23px;

    background:
        linear-gradient(
            145deg,
            rgba(
                var(--accentRGB),
                .20
            ),
            rgba(
                var(--accentRGB),
                .06
            )
        );

    border:
        1px solid
        rgba(
            var(--accentRGB),
            .18
        );

    box-shadow:
        0 8px 28px
        rgba(
            var(--accentRGB),
            .12
        );

    transition:
        .35s ease;
}


.boy .logo {
    box-shadow:
        0 0 24px
        rgba(
            0,
            190,
            255,
            .16
        );
}


.logo:active {
    transform: scale(.92);
}


.header h1 {

    margin: 0;

    font-size: 21px;

    font-weight: 800;

    letter-spacing:
        -.6px;
}


.header p {

    margin:
        3px 0 0;

    font-size: 11px;

    color:
        var(--muted);
}


/* =====================================================
   TEMA BUTONU
===================================================== */

.theme-button {

    width: 44px;
    height: 44px;

    border-radius: 15px;

    border:
        1px solid
        var(--border);

    background:
        var(--card);

    color:
        var(--text);

    font-size: 19px;

    display: flex;

    align-items: center;
    justify-content: center;

    box-shadow:
        0 7px 25px
        rgba(0,0,0,.18);

    transition:
        .2s ease;
}


.theme-button:active {
    transform:
        scale(.88)
        rotate(-8deg);
}


/* =====================================================
   ARAMA
===================================================== */

.search {

    padding:
        8px 18px 16px;

    animation:
        fadeUp .45s .05s ease both;
}


.search-box {
    position: relative;
}


.search-icon {

    position: absolute;

    left: 16px;
    top: 14px;

    color:
        var(--muted);

    font-size: 19px;

    pointer-events: none;
}


.search input {

    width: 100%;
    height: 50px;

    border-radius: 16px;

    border:
        1px solid
        var(--border);

    outline: none;

    background:
        var(--card);

    color:
        var(--text);

    padding:
        0 16px 0 45px;

    font-size: 13px;

    box-shadow:
        0 8px 28px
        rgba(0,0,0,.13);

    transition:
        .25s ease;
}


.search input::placeholder {
    color: var(--muted);
}


.search input:focus {

    border-color:
        rgba(
            var(--accentRGB),
            .45
        );

    box-shadow:
        0 0 0 4px
        rgba(
            var(--accentRGB),
            .07
        );
}


/* =====================================================
   İSTATİSTİKLER
===================================================== */

.stats {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 9px;

    padding:
        0 18px 18px;

    animation:
        fadeUp .45s .1s ease both;
}


.stat {

    padding:
        14px 7px;

    border-radius: 17px;

    text-align: center;

    background:
        var(--card);

    border:
        1px solid
        var(--border);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.12);

    transition:
        .25s ease;
}


.stat:active {
    transform: scale(.97);
}


.stat-number {

    font-size: 20px;

    font-weight: 850;

    letter-spacing:
        -.5px;
}


.stat-label {

    margin-top: 3px;

    font-size: 9px;

    color:
        var(--muted);
}


/* =====================================================
   BÖLÜM BAŞLIĞI
===================================================== */

.section-title {

    padding:
        0 18px 12px;

    display: flex;

    align-items: center;

    justify-content: space-between;
}


.section-title h2 {

    margin: 0;

    font-size: 15px;

    font-weight: 800;
}


.section-title span {

    font-size: 10px;

    color:
        var(--muted);
}


/* =====================================================
   LİSTE
===================================================== */

.list {
    padding: 0 18px;
}


/* =====================================================
   KART
===================================================== */

.card {

    position: relative;

    overflow: hidden;

    margin-bottom: 13px;

    padding: 16px;

    border-radius: 21px;

    background:
        linear-gradient(
            145deg,
            var(--card2),
            var(--card)
        );

    border:
        1px solid
        var(--border);

    box-shadow:
        0 10px 32px
        rgba(0,0,0,.18);

    animation:
        cardIn .42s ease both;

    transition:
        transform .22s ease,
        box-shadow .3s ease,
        border .3s ease;
}


.card:active {
    transform: scale(.985);
}


.boy .card {

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.25),
        0 0 25px
        rgba(
            0,
            170,
            255,
            .025
        );
}


.girl .card {

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.18),
        0 0 25px
        rgba(
            255,
            92,
            154,
            .025
        );
}


@keyframes cardIn {

    from {
        opacity: 0;
        transform:
            translateY(10px)
            scale(.985);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* =====================================================
   DURUM ÇİZGİSİ
===================================================== */

.status-line {

    position: absolute;

    left: 0;
    top: 15px;
    bottom: 15px;

    width: 3px;

    border-radius:
        0 5px 5px 0;
}


.card.green .status-line {
    background: var(--green);
}


.card.yellow .status-line {
    background: var(--yellow);
}


.card.red .status-line {
    background: var(--red);
}


/* =====================================================
   KART ÜST
===================================================== */

.card-top {

    display: flex;

    align-items: center;

    gap: 12px;
}


.icon {

    width: 49px;
    height: 49px;

    flex-shrink: 0;

    border-radius: 16px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 23px;

    background:
        rgba(
            var(--accentRGB),
            .09
        );

    border:
        1px solid
        rgba(
            var(--accentRGB),
            .09
        );

    transition:
        .3s ease;
}


.card:active .icon {
    transform: scale(.94);
}


.title {

    font-size: 15px;

    font-weight: 800;

    line-height: 1.2;
}


.last-date {

    margin-top: 4px;

    font-size: 10px;

    color:
        var(--muted);
}


/* =====================================================
   GERİ SAYIM
===================================================== */

.countdown {

    margin-top: 14px;

    padding:
        15px 10px;

    border-radius: 17px;

    text-align: center;

    transition:
        .3s ease;
}


.card.green .countdown {
    background:
        rgba(69,217,155,.08);
}


.card.yellow .countdown {
    background:
        rgba(255,196,91,.08);
}


.card.red .countdown {
    background:
        rgba(255,97,117,.08);
}


.count-number {

    font-size: 29px;

    font-weight: 900;

    line-height: 1;

    letter-spacing:
        -1px;

    animation:
        numberIn .3s ease;
}


.count-text {

    margin-top: 5px;

    font-size: 9px;

    font-weight: 800;

    letter-spacing:
        .5px;

    opacity: .65;
}


@keyframes numberIn {

    from {
        opacity: 0;
        transform: scale(.9);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}


/* =====================================================
   DETAYLAR
===================================================== */

.details {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 7px;

    margin-top: 8px;
}


.detail {

    padding: 9px;

    border-radius: 13px;

    background:
        rgba(
            255,
            255,
            255,
            .025
        );

    border:
        1px solid
        var(--border);
}


.detail-label {

    font-size: 8px;

    color:
        var(--muted);
}


.detail-value {

    margin-top: 3px;

    font-size: 10px;

    font-weight: 700;
}


/* =====================================================
   DURUM
===================================================== */

.status {

    display: flex;

    align-items: center;

    gap: 6px;

    margin-top: 11px;

    font-size: 10px;

    font-weight: 800;
}


.status.green {
    color: var(--green);
}


.status.yellow {
    color: var(--yellow);
}


.status.red {
    color: var(--red);
}


/* =====================================================
   BUTONLAR
===================================================== */

.buttons {

    display: grid;

    grid-template-columns:
        1fr 43px 43px;

    gap: 7px;

    margin-top: 12px;
}


.done,
.edit,
.delete {

    height: 42px;

    border-radius: 13px;

    border: 1px solid
        var(--border);

    font-size: 11px;

    font-weight: 800;

    transition:
        .18s ease;
}


.done {

    color: #fff;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    border: none;

    box-shadow:
        0 7px 18px
        rgba(
            var(--accentRGB),
            .20
        );
}


.boy .done {

    box-shadow:
        0 0 18px
        rgba(
            0,
            180,
            255,
            .17
        );
}


.done:active,
.edit:active,
.delete:active {

    transform:
        scale(.91);
}


.edit,
.delete {

    background:
        rgba(
            255,
            255,
            255,
            .025
        );

    color:
        var(--text);
}


.delete {
    color: var(--red);
}


/* =====================================================
   ALT EKLE BUTONU
===================================================== */

.add-button {

    position: fixed;

    z-index: 20;

    bottom:
        calc(
            17px +
            env(safe-area-inset-bottom)
        );

    left: 50%;

    transform:
        translateX(-50%);

    width:
        calc(100% - 36px);

    max-width:
        484px;

    height: 53px;

    border: none;

    border-radius: 17px;

    color: white;

    font-size: 12px;

    font-weight: 850;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    box-shadow:
        0 10px 30px
        rgba(
            var(--accentRGB),
            .28
        );

    transition:
        .2s ease;
}


.add-button:active {

    transform:
        translateX(-50%)
        scale(.96);
}


/* =====================================================
   MODAL
===================================================== */

.modal-bg {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: flex-end;

    justify-content: center;

    background:
        rgba(0,0,0,.65);

    backdrop-filter:
        blur(8px);
}


.modal {

    width: 100%;

    max-width: 520px;

    padding:
        22px 18px
        calc(
            24px +
            env(safe-area-inset-bottom)
        );

    border-radius:
        27px 27px 0 0;

    background:
        linear-gradient(
            145deg,
            var(--card2),
            var(--card)
        );

    border:
        1px solid
        var(--border);

    box-shadow:
        0 -15px 50px
        rgba(0,0,0,.35);

    animation:
        modalIn .32s
        cubic-bezier(.2,.8,.2,1);
}


@keyframes modalIn {

    from {
        opacity: .7;
        transform:
            translateY(100%);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }
}


.modal-head {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 15px;
}


.modal h2 {

    margin: 0;

    font-size: 19px;

    font-weight: 850;
}


.close {

    width: 38px;
    height: 38px;

    border-radius: 13px;

    border: 1px solid
        var(--border);

    background:
        rgba(
            255,
            255,
            255,
            .035
        );

    color:
        var(--text);

    font-size: 15px;

    transition: .2s;
}


.close:active {
    transform:
        scale(.88)
        rotate(8deg);
}


/* =====================================================
   FORM
===================================================== */

.form-label {

    display: block;

    margin:
        12px 0 6px;

    font-size: 10px;

    font-weight: 700;

    color:
        var(--muted);
}


.modal input {

    width: 100%;

    height: 48px;

    border-radius: 13px;

    border:
        1px solid
        var(--border);

    background:
        rgba(
            255,
            255,
            255,
            .035
        );

    color:
        var(--text);

    outline: none;

    padding:
        0 13px;

    font-size: 13px;

    transition:
        .2s ease;
}


.modal input:focus {

    border-color:
        rgba(
            var(--accentRGB),
            .45
        );

    box-shadow:
        0 0 0 4px
        rgba(
            var(--accentRGB),
            .06
        );
}


.row {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 9px;
}


.save {

    width: 100%;

    height: 49px;

    margin-top: 18px;

    border: none;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    color: white;

    font-size: 12px;

    font-weight: 850;

    box-shadow:
        0 8px 22px
        rgba(
            var(--accentRGB),
            .22
        );

    transition: .18s;
}


.save:active {
    transform: scale(.97);
}


.cancel {

    width: 100%;

    height: 43px;

    margin-top: 7px;

    border: 1px solid
        var(--border);

    border-radius: 13px;

    background:
        rgba(
            255,
            255,
            255,
            .025
        );

    color:
        var(--text);

    font-size: 11px;

    font-weight: 700;
}


/* =====================================================
   TEMA PANELİ
===================================================== */

.theme-panel {

    position: fixed;

    inset: 0;

    z-index: 120;

    display: none;

    align-items: flex-end;

    justify-content: center;

    background:
        rgba(0,0,0,.65);

    backdrop-filter:
        blur(8px);
}


.theme-content {

    width: 100%;

    max-width: 520px;

    padding:
        23px 18px
        calc(
            24px +
            env(safe-area-inset-bottom)
        );

    border-radius:
        27px 27px 0 0;

    background:
        linear-gradient(
            145deg,
            var(--card2),
            var(--card)
        );

    border:
        1px solid
        var(--border);

    animation:
        modalIn .32s
        cubic-bezier(.2,.8,.2,1);
}


.theme-content h2 {

    margin:
        0 0 5px;

    font-size: 19px;

    font-weight: 850;
}


.theme-subtitle {

    margin:
        0 0 18px;

    font-size: 10px;

    color:
        var(--muted);
}


/* =====================================================
   TEMA SEÇİM KARTLARI
===================================================== */

.theme-choice {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

    margin-bottom: 17px;
}


.theme-card {

    position: relative;

    height: 105px;

    overflow: hidden;

    border-radius: 18px;

    border:
        2px solid
        transparent;

    padding: 14px;

    text-align: left;

    color: white;

    transition:
        .22s ease;
}


.theme-card:active {

    transform:
        scale(.96);
}


.theme-card.girl-theme {

    background:
        linear-gradient(
            145deg,
            #351624,
            #1d1018
        );

    border-color:
        rgba(
            255,
            92,
            154,
            .15
        );
}


.theme-card.boy-theme {

    background:
        linear-gradient(
            145deg,
            #09263a,
            #07131e
        );

    border-color:
        rgba(
            0,
            190,
            255,
            .15
        );
}


.theme-card.active {

    border-color:
        var(--accent);

    box-shadow:
        0 0 25px
        rgba(
            var(--accentRGB),
            .18
        );
}


.theme-card-icon {

    font-size: 25px;

    margin-bottom: 7px;
}


.theme-card-title {

    font-size: 12px;

    font-weight: 850;
}


.theme-card-desc {

    margin-top: 3px;

    font-size: 8px;

    opacity: .55;
}


/* =====================================================
   BOŞ DURUM
===================================================== */

.empty {

    padding:
        55px 20px;

    text-align: center;

    color:
        var(--muted);

    animation:
        fadeUp .4s ease;
}


.empty-icon {

    width: 72px;
    height: 72px;

    margin:
        0 auto 15px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 24px;

    background:
        rgba(
            var(--accentRGB),
            .08
        );

    font-size: 34px;
}


.empty h3 {

    margin:
        0 0 6px;

    font-size: 15px;

    color:
        var(--text);
}


.empty p {

    margin: 0;

    font-size: 11px;

    line-height: 1.6;
}


/* =====================================================
   ANİMASYONLAR
===================================================== */

@keyframes fadeUp {

    from {
        opacity: 0;
        transform:
            translateY(9px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }
}


/* =====================================================
   KÜÇÜK TELEFONLAR
===================================================== */

@media (max-width: 360px) {

    .header h1 {
        font-size: 19px;
    }

    .card {
        padding: 14px;
    }

    .count-number {
        font-size: 27px;
    }

    .details {
        gap: 5px;
    }

    .buttons {
        grid-template-columns:
            1fr 40px 40px;
    }
}


/* =====================================================
   ANİMASYONLARI AZALT
===================================================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        transition-duration:
            .01ms !important;
    }
}

</style>
</head>


<body class="girl">


<div class="app">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="header-row">

        <div class="logo-area">

            <div class="logo" id="logo">
                🎀
            </div>

            <div>

                <h1>
                    Son Ne Zaman?
                </h1>

                <p id="subtitle">
                    Kendin için küçük bir hatırlatıcı.
                </p>

            </div>

        </div>


        <button
            class="theme-button"
            onclick="openTheme()"
            id="themeButton">

            🎨

        </button>

    </div>

</header>


<!-- =====================================================
     ARAMA
===================================================== -->

<div class="search">

    <div class="search-box">

        <span class="search-icon">
            ⌕
        </span>

        <input
            id="search"
            type="text"
            placeholder="Takiplerinde ara..."
            oninput="render()">

    </div>

</div>


<!-- =====================================================
     İSTATİSTİKLER
===================================================== -->

<div class="stats">

    <div class="stat">

        <div
            class="stat-number"
            id="total">

            0

        </div>

        <div class="stat-label">
            Toplam
        </div>

    </div>


    <div class="stat">

        <div
            class="stat-number"
            id="today">

            0

        </div>

        <div class="stat-label">
            Bugün
        </div>

    </div>


    <div class="stat">

        <div
            class="stat-number"
            id="late">

            0

        </div>

        <div class="stat-label">
            Geciken
        </div>

    </div>

</div>


<!-- =====================================================
     BAŞLIK
===================================================== -->

<div class="section-title">

    <h2>
        Takip ettiklerin
    </h2>

    <span id="itemCount">
        0 kayıt
    </span>

</div>


<!-- =====================================================
     LİSTE
===================================================== -->

<div
    class="list"
    id="list">
</div>


</div>


<!-- =====================================================
     EKLE
===================================================== -->

<button
    class="add-button"
    onclick="openAdd()">

    ＋ Yeni takip ekle

</button>


<!-- =====================================================
     MODAL
===================================================== -->

<div
    class="modal-bg"
    id="modalBg">

    <div class="modal">

        <div class="modal-head">

            <h2 id="modalTitle">
                Yeni takip
            </h2>

            <button
                class="close"
                onclick="closeModal()">

                ✕

            </button>

        </div>


        <label class="form-label">
            Ne yaptın?
        </label>

        <input
            id="name"
            type="text"
            placeholder="Örn: Tıraş oldum">


        <div class="row">

            <div>

                <label class="form-label">
                    Emoji
                </label>

                <input
                    id="emoji"
                    type="text"
                    maxlength="2"
                    value="🧠">

            </div>


            <div>

                <label class="form-label">
                    Döngü (gün)
                </label>

                <input
                    id="cycle"
                    type="number"
                    min="1"
                    placeholder="7">

            </div>

        </div>


        <label class="form-label">
            Son yaptığın tarih
        </label>

        <input
            id="date"
            type="date">


        <button
            class="save"
            onclick="saveItem()">

            Kaydet

        </button>


        <button
            class="cancel"
            onclick="closeModal()">

            Vazgeç

        </button>

    </div>

</div>


<!-- =====================================================
     TEMA
===================================================== -->

<div
    class="theme-panel"
    id="themePanel">

    <div class="theme-content">

        <h2>
            Temanı seç
        </h2>

        <p class="theme-subtitle">
            Uygulamanın görünümünü kendine göre ayarla.
        </p>


        <div class="theme-choice">


            <!-- KIZ -->

            <button
                class="theme-card girl-theme"
                id="girlTheme"
                onclick="setTheme('girl')">

                <div class="theme-card-icon">
                    🎀
                </div>

                <div class="theme-card-title">
                    Şirin Pembe
                </div>

                <div class="theme-card-desc">
                    Yumuşak ve zarif
                </div>

            </button>


            <!-- ERKEK -->

            <button
                class="theme-card boy-theme"
                id="boyTheme"
                onclick="setTheme('boy')">

                <div class="theme-card-icon">
                    ⚡
                </div>

                <div class="theme-card-title">
                    Neon Mavi
                </div>

                <div class="theme-card-desc">
                    Koyu ve teknolojik
                </div>

            </button>


        </div>


        <button
            class="cancel"
            onclick="closeTheme()">

            Kapat

        </button>

    </div>

</div>


<script>

/* =====================================================
   STORAGE
===================================================== */

const STORAGE_KEY =
    "son_ne_zaman_v4";

const SETTINGS_KEY =
    "son_ne_zaman_settings_v4";


let items =
    JSON.parse(
        localStorage.getItem(
            STORAGE_KEY
        ) || "[]"
    );


let settings =
    JSON.parse(
        localStorage.getItem(
            SETTINGS_KEY
        ) || "{}"
    );


let editingId = null;


/* =====================================================
   VERİ KAYDET
===================================================== */

function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(items)
    );

}


/* =====================================================
   AYAR KAYDET
===================================================== */

function saveSettings() {

    localStorage.setItem(
        SETTINGS_KEY,
        JSON.stringify(settings)
    );

}


/* =====================================================
   BUGÜN
===================================================== */

function todayString() {

    const d = new Date();

    const y =
        d.getFullYear();

    const m =
        String(
            d.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            d.getDate()
        ).padStart(2,"0");

    return `${y}-${m}-${day}`;

}


/* =====================================================
   TARİH
===================================================== */

function dateToDate(value) {

    const p =
        value.split("-")
        .map(Number);

    return new Date(
        p[0],
        p[1] - 1,
        p[2]
    );

}


/* =====================================================
   GÜN FARKI
===================================================== */

function daysBetween(
    date1,
    date2
) {

    return Math.round(
        (
            dateToDate(date2) -
            dateToDate(date1)
        ) / 86400000
    );

}


/* =====================================================
   GÜN EKLE
===================================================== */

function addDays(
    dateString,
    days
) {

    const d =
        dateToDate(dateString);

    d.setDate(
        d.getDate() +
        Number(days)
    );


    const y =
        d.getFullYear();

    const m =
        String(
            d.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            d.getDate()
        ).padStart(2,"0");


    return `${y}-${m}-${day}`;

}


/* =====================================================
   TARİH GÖSTER
===================================================== */

function formatDate(
    dateString
) {

    return dateToDate(
        dateString
    ).toLocaleDateString(
        "tr-TR",
        {
            day: "2-digit",
            month: "long",
            year: "numeric"
        }
    );

}


/* =====================================================
   SONRAKİ TARİH
===================================================== */

function getNextDate(item) {

    return addDays(
        item.lastDate,
        item.cycle
    );

}


/* =====================================================
   GERİ SAYIM
===================================================== */

function getCountdown(item) {

    const next =
        getNextDate(item);

    return {

        next: next,

        remaining:
            daysBetween(
                todayString(),
                next
            )

    };

}


/* =====================================================
   DURUM
===================================================== */

function getStatus(item) {

    const data =
        getCountdown(item);

    const remaining =
        data.remaining;

    const cycle =
        Number(item.cycle);


    const warning =
        Math.max(
            1,
            Math.ceil(
                cycle * .30
            )
        );


    if (remaining < 0) {

        return {
            type: "red",
            text: "Gecikti"
        };

    }


    if (remaining === 0) {

        return {
            type: "red",
            text: "Bugün"
        };

    }


    if (
        remaining <= warning
    ) {

        return {
            type: "yellow",
            text: "Yaklaşıyor"
        };

    }


    return {
        type: "green",
        text: "Zaman var"
    };

}


/* =====================================================
   GERİ SAYIM YAZISI
===================================================== */

function countdownText(item) {

    const days =
        getCountdown(item)
        .remaining;


    if (days < 0) {

        return {

            number:
                Math.abs(days),

            text:
                "GÜN GECİKTİ"

        };

    }


    if (days === 0) {

        return {

            number: "0",

            text: "BUGÜN"

        };

    }


    return {

        number: days,

        text:
            "GÜN KALDI"

    };

}


/* =====================================================
   HTML GÜVENLİĞİ
===================================================== */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* =====================================================
   RENDER
===================================================== */

function render() {

    const list =
        document.getElementById("list");


    const search =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();


    let filtered =
        items.filter(
            item =>
                item.name
                .toLowerCase()
                .includes(search)
        );


    document.getElementById(
        "total"
    ).textContent =
        items.length;


    document.getElementById(
        "today"
    ).textContent =
        items.filter(
            item =>
                item.lastDate ===
                todayString()
        ).length;


    document.getElementById(
        "late"
    ).textContent =
        items.filter(
            item =>
                getStatus(item).type ===
                "red"
        ).length;


    document.getElementById(
        "itemCount"
    ).textContent =
        `${filtered.length} kayıt`;


    const priority = {

        red: 3,
        yellow: 2,
        green: 1

    };


    filtered.sort(
        (a,b) => {

            const sa =
                getStatus(a);

            const sb =
                getStatus(b);


            if (
                priority[sb.type] !==
                priority[sa.type]
            ) {

                return
                    priority[sb.type] -
                    priority[sa.type];

            }


            return
                getCountdown(a).remaining -
                getCountdown(b).remaining;

        }
    );


    if (
        filtered.length === 0
    ) {

        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ${items.length === 0 ? "✨" : "🔎"}
                </div>

                <h3>
                    ${
                        items.length === 0
                        ? "Henüz takip eklemedin"
                        : "Sonuç bulunamadı"
                    }
                </h3>

                <p>
                    ${
                        items.length === 0
                        ? "Hatırlamak istediğin bir şeyi ekleyerek başlayabilirsin."
                        : "Başka bir kelimeyle tekrar deneyebilirsin."
                    }
                </p>

            </div>

        `;

        return;

    }


    list.innerHTML =
        filtered
        .map(
            (item,index) => {

                const status =
                    getStatus(item);

                const count =
                    countdownText(item);

                const next =
                    getNextDate(item);


                return `

                <div
                    class="card ${status.type}"
                    style="
                        animation-delay:
                        ${Math.min(
                            index * .045,
                            .25
                        )}s
                    ">

                    <div class="status-line"></div>


                    <div class="card-top">

                        <div class="icon">

                            ${escapeHtml(
                                item.emoji
                            )}

                        </div>


                        <div>

                            <div class="title">

                                ${escapeHtml(
                                    item.name
                                )}

                            </div>


                            <div class="last-date">

                                Son yaptığın:
                                ${formatDate(
                                    item.lastDate
                                )}

                            </div>

                        </div>

                    </div>


                    <div class="countdown">

                        <div class="count-number">

                            ${count.number}

                        </div>

                        <div class="count-text">

                            ${count.text}

                        </div>

                    </div>


                    <div class="details">

                        <div class="detail">

                            <div class="detail-label">
                                Döngü
                            </div>

                            <div class="detail-value">

                                ${item.cycle}
                                günde bir

                            </div>

                        </div>


                        <div class="detail">

                            <div class="detail-label">
                                Sonraki
                            </div>

                            <div class="detail-value">

                                ${formatDate(
                                    next
                                )}

                            </div>

                        </div>

                    </div>


                    <div
                        class="status ${status.type}">

                        ●
                        ${status.text}

                    </div>


                    <div class="buttons">

                        <button
                            class="done"
                            onclick="
                                markDone(
                                    '${item.id}'
                                )
                            ">

                            ✓ Bugün yaptım

                        </button>


                        <button
                            class="edit"
                            onclick="
                                editItem(
                                    '${item.id}'
                                )
                            ">

                            ✏️

                        </button>


                        <button
                            class="delete"
                            onclick="
                                deleteItem(
                                    '${item.id}'
                                )
                            ">

                            🗑️

                        </button>

                    </div>

                </div>

                `;

            }
        )
        .join("");

}


/* =====================================================
   YENİ EKLE
===================================================== */

function openAdd() {

    editingId = null;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Yeni takip";


    document.getElementById(
        "name"
    ).value = "";


    document.getElementById(
        "emoji"
    ).value =
        document.body.classList
        .contains("boy")
        ? "⚡"
        : "🎀";


    document.getElementById(
        "cycle"
    ).value = "7";


    document.getElementById(
        "date"
    ).value =
        todayString();


    document.getElementById(
        "modalBg"
    ).style.display =
        "flex";

}


/* =====================================================
   DÜZENLE
===================================================== */

function editItem(id) {

    const item =
        items.find(
            x => x.id === id
        );


    if (!item) return;


    editingId = id;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Takibi düzenle";


    document.getElementById(
        "name"
    ).value =
        item.name;


    document.getElementById(
        "emoji"
    ).value =
        item.emoji;


    document.getElementById(
        "cycle"
    ).value =
        item.cycle;


    document.getElementById(
        "date"
    ).value =
        item.lastDate;


    document.getElementById(
        "modalBg"
    ).style.display =
        "flex";

}


/* =====================================================
   KAYDET
===================================================== */

function saveItem() {

    const name =
        document.getElementById(
            "name"
        ).value.trim();


    const emoji =
        document.getElementById(
            "emoji"
        ).value.trim() ||
        "🎀";


    const cycle =
        Number(
            document.getElementById(
                "cycle"
            ).value
        );


    const date =
        document.getElementById(
            "date"
        ).value;


    if (!name) {

        alert(
            "Bir isim gir."
        );

        return;

    }


    if (
        !cycle ||
        cycle < 1
    ) {

        alert(
            "Döngü en az 1 gün olmalı."
        );

        return;

    }


    if (!date) {

        alert(
            "Tarih seç."
        );

        return;

    }


    if (editingId) {

        const item =
            items.find(
                x =>
                    x.id ===
                    editingId
            );


        if (!item) return;


        item.name =
            name;

        item.emoji =
            emoji;

        item.cycle =
            cycle;

        item.lastDate =
            date;

    } else {

        items.push({

            id:
                Date.now()
                .toString(),

            name:
                name,

            emoji:
                emoji,

            cycle:
                cycle,

            lastDate:
                date,

            history:
                [date]

        });

    }


    saveData();

    closeModal();

    render();

}


/* =====================================================
   BUGÜN YAPTIM
===================================================== */

function markDone(id) {

    const item =
        items.find(
            x =>
                x.id === id
        );


    if (!item) return;


    const today =
        todayString();


    if (!item.history) {

        item.history = [];

    }


    if (
        item.lastDate !==
        today
    ) {

        item.lastDate =
            today;

        item.history.push(
            today
        );

    }


    saveData();

    render();

}


/* =====================================================
   SİL
===================================================== */

function deleteItem(id) {

    const item =
        items.find(
            x =>
                x.id === id
        );


    if (!item) return;


    if (
        confirm(
            `"${item.name}" silinsin mi?`
        )
    ) {

        items =
            items.filter(
                x =>
                    x.id !== id
            );


        saveData();

        render();

    }

}


/* =====================================================
   MODAL KAPAT
===================================================== */

function closeModal() {

    document.getElementById(
        "modalBg"
    ).style.display =
        "none";

}


/* =====================================================
   TEMA PANELİ
===================================================== */

function openTheme() {

    document.getElementById(
        "themePanel"
    ).style.display =
        "flex";

    updateThemeButtons();

}


function closeTheme() {

    document.getElementById(
        "themePanel"
    ).style.display =
        "none";

}


/* =====================================================
   TEMA DEĞİŞTİR
===================================================== */

function setTheme(theme) {

    settings.theme =
        theme;

    saveSettings();

    applyTheme();

    updateThemeButtons();

}


/* =====================================================
   TEMA UYGULA
===================================================== */

function applyTheme() {

    const theme =
        settings.theme ||
        "girl";


    document.body.classList
        .remove(
            "girl",
            "boy"
        );


    document.body.classList
        .add(theme);


    const logo =
        document.getElementById(
            "logo"
        );


    const subtitle =
        document.getElementById(
            "subtitle"
        );


    const themeButton =
        document.getElementById(
            "themeButton"
        );


    if (
        theme === "boy"
    ) {

        logo.textContent =
            "⚡";

        subtitle.textContent =
            "Sade, hızlı ve senin kontrolünde.";

        themeButton.textContent =
            "⚡";

        document
            .querySelector(
                'meta[name="theme-color"]'
            )
            .setAttribute(
                "content",
                "#00aaff"
            );

    } else {

        logo.textContent =
            "🎀";

        subtitle.textContent =
            "Kendin için küçük bir hatırlatıcı.";

        themeButton.textContent =
            "🎀";

        document
            .querySelector(
                'meta[name="theme-color"]'
            )
            .setAttribute(
                "content",
                "#ff5c9a"
            );

    }

}


/* =====================================================
   AKTİF TEMA
===================================================== */

function updateThemeButtons() {

    const theme =
        settings.theme ||
        "girl";


    document
        .getElementById(
            "girlTheme"
        )
        .classList
        .toggle(
            "active",
            theme === "girl"
        );


    document
        .getElementById(
            "boyTheme"
        )
        .classList
        .toggle(
            "active",
            theme === "boy"
        );

}


/* =====================================================
   DIŞARI TIKLAMA
===================================================== */

document
    .getElementById("modalBg")
    .addEventListener(
        "click",
        function(e) {

            if (
                e.target === this
            ) {

                closeModal();

            }

        }
    );


document
    .getElementById("themePanel")
    .addEventListener(
        "click",
        function(e) {

            if (
                e.target === this
            ) {

                closeTheme();

            }

        }
    );


/* =====================================================
   HER DAKİKA KONTROL
===================================================== */

setInterval(
    render,
    60000
);


/* =====================================================
   BAŞLAT
===================================================== */

if (!settings.theme) {

    settings.theme =
        "girl";

    saveSettings();

}


applyTheme();

updateThemeButtons();

render();

</script>

</body>
</html>
